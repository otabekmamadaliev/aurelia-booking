name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install` so a run can never silently drift
      # from the lockfile the change was tested against.
      - run: npm ci

      - run: npm run lint
      - run: npm test
      - run: npm run build
